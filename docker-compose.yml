# PostgreSQL para desenvolvimento local.
# Credenciais simples, só para uso local: nunca use estas em produção.
services:
  db:
    image: postgres:17-alpine
    container_name: central-atendimento-db
    environment:
      POSTGRES_USER: atendimento
      POSTGRES_PASSWORD: atendimento
      POSTGRES_DB: atendimento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atendimento -d atendimento"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
